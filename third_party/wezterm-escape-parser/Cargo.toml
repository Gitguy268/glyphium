[package]
authors = ["Wez Furlong"]
name = "wezterm-escape-parser"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/wezterm/wezterm"
description = "Escape Sequence Parser"
license = "MIT"
documentation = "https://docs.rs/wezterm-escape-parser"
keywords = ["terminal", "escape", "parser"]

[dependencies]
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
bitflags = "2.0"
hex = { version = "0.4", default-features = false, features = ["alloc"] }
image = { version = "0.25", optional = true }
log = "0.4"
num-derive = "0.4"
num-traits = { version = "0.2", default-features = false }
ordered-float = { version = "4.1", default-features = false }
pest = { version = "2.7", optional = true }
pest_derive = { version = "2.7", optional = true }
serde = { version = "1.0", default-features = false, features = ["derive"], optional = true }
sha2 = { version = "0.10", optional = true }
thiserror = {version = "2.0", default-features=false }
vtparse = { git = "https://github.com/wezterm/wezterm.git", rev = "e2a98e1b8af156988ad0ac778658ac27b60a55fb", default-features = false, features = ["alloc"] }
wezterm-blob-leases = { git = "https://github.com/wezterm/wezterm.git", rev = "e2a98e1b8af156988ad0ac778658ac27b60a55fb", optional = true }
wezterm-color-types = { git = "https://github.com/wezterm/wezterm.git", rev = "e2a98e1b8af156988ad0ac778658ac27b60a55fb", default-features = false }
wezterm-dynamic = { git = "https://github.com/wezterm/wezterm.git", rev = "e2a98e1b8af156988ad0ac778658ac27b60a55fb", default-features = false }
wezterm-input-types = { git = "https://github.com/wezterm/wezterm.git", rev = "e2a98e1b8af156988ad0ac778658ac27b60a55fb", default-features = false }

# Glyphium patch: nix is only needed (and only builds) on Unix.
[target."cfg(unix)".dependencies]
nix = { version = "0.29", optional = true, features = ["mman", "fs"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_System_Memory",
], optional = true }

[features]
std = ["vtparse/std", "thiserror/std", "wezterm-input-types/std", "hex/std", "wezterm-dynamic/std"]
kitty-shm = ["dep:nix", "dep:windows-sys"]
use_serde = ["dep:serde", "wezterm-color-types/use_serde", "wezterm-blob-leases/serde", "bitflags/serde", "wezterm-input-types/serde"]
use_image = ["image", "dep:image"]
image = ["sha2", "wezterm-blob-leases"]
tmux_cc = ["dep:pest", "dep:pest_derive"]
docs = ["use_serde", "image", "tmux_cc", "kitty-shm"]

