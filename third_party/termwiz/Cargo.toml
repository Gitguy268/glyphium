[package]
authors = ["Wez Furlong"]
name = "termwiz"
version = "0.24.0"
edition = "2018"
repository = "https://github.com/wezterm/wezterm"
description = "Terminal Wizardry for Unix and Windows"
license = "MIT"
documentation = "https://docs.rs/termwiz"
keywords = ["terminal", "readline", "console", "curses"]
readme = "README.md"

[dependencies]
anyhow = "1.0"
bitflags = "2.0"
cassowary = { version = "0.3", optional=true }
fancy-regex = { version = "0.14", default-features = false }
finl_unicode = { version = "1.3", git = "https://github.com/wez/finl_unicode.git", branch = "no_std", default-features = false, features = ["categories", "grapheme_clusters"] }
fixedbitset = { version = "0.4", default-features = false }
fnv = { version = "1.0", optional=true }
image = { version = "0.25", optional=true }
log = "0.4"
memmem = "0.1"
num-derive = "0.4"
num-traits = { version = "0.2", default-features = false }
ordered-float = { version = "4.1", default-features = false, features=["std"] }
pest = { version = "2.7", optional=true }
pest_derive = { version = "2.7", optional=true }
phf = { version = "0.11", default-features = false }
serde = { version = "1.0", default-features = false, features = ["rc", "derive"], optional=true }
sha2 = { version = "0.10", optional=true }
siphasher = "1.0.1"
thiserror = "2.0"
ucd-trie = { version = "0.1", default-features = false }
unicode-segmentation = "1.12"
vtparse = { git = "https://github.com/wezterm/wezterm.git", rev = "e2a98e1b8af156988ad0ac778658ac27b60a55fb", default-features = false }
wezterm-bidi = { git = "https://github.com/wezterm/wezterm.git", rev = "e2a98e1b8af156988ad0ac778658ac27b60a55fb", default-features = false }
wezterm-blob-leases = { git = "https://github.com/wezterm/wezterm.git", rev = "e2a98e1b8af156988ad0ac778658ac27b60a55fb", optional=true }
wezterm-cell = { git = "https://github.com/wezterm/wezterm.git", rev = "e2a98e1b8af156988ad0ac778658ac27b60a55fb", features=["std"] }
wezterm-char-props = { git = "https://github.com/wezterm/wezterm.git", rev = "e2a98e1b8af156988ad0ac778658ac27b60a55fb", default-features = false }
wezterm-color-types = { git = "https://github.com/wezterm/wezterm.git", rev = "e2a98e1b8af156988ad0ac778658ac27b60a55fb", default-features = false, features=["std"] }
wezterm-dynamic = { git = "https://github.com/wezterm/wezterm.git", rev = "e2a98e1b8af156988ad0ac778658ac27b60a55fb", default-features = false, features=["std"] }
wezterm-escape-parser = { git = "https://github.com/wezterm/wezterm.git", rev = "e2a98e1b8af156988ad0ac778658ac27b60a55fb", features=["std"] }
wezterm-input-types = { git = "https://github.com/wezterm/wezterm.git", rev = "e2a98e1b8af156988ad0ac778658ac27b60a55fb", default-features = false }
wezterm-surface = { git = "https://github.com/wezterm/wezterm.git", rev = "e2a98e1b8af156988ad0ac778658ac27b60a55fb", features=["std", "appdata"] }

# Glyphium patch: tty, terminfo and fd support only off the web.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
filedescriptor = { git = "https://github.com/wezterm/wezterm.git", rev = "e2a98e1b8af156988ad0ac778658ac27b60a55fb" }
libc = "0.2"
terminfo = "0.9"

[features]
default = ["image", "tmux_cc"]
widgets = ["cassowary", "fnv"]
use_serde = ["serde", "wezterm-color-types/use_serde", "wezterm-blob-leases/serde", "bitflags/serde", "wezterm-input-types/serde", "wezterm-escape-parser/use_serde", "wezterm-cell/use_serde", "wezterm-surface/use_serde"]
use_image = ["image", "dep:image", "wezterm-escape-parser/use_image", "wezterm-escape-parser/kitty-shm", "wezterm-cell/use_image", "wezterm-surface/use_image"]
image = ["sha2", "wezterm-blob-leases", "wezterm-escape-parser/image"]
tmux_cc = ["pest", "pest_derive", "wezterm-escape-parser/tmux_cc"]
docs = ["widgets", "use_serde", "image", "tmux_cc"]

[target."cfg(unix)".dependencies]
signal-hook = "0.3"
termios = "0.3"
nix = { version = "0.29", features = ["mman", "fs"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
