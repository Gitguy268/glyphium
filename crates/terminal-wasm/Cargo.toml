[package]
name = "glyphium-terminal-wasm"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Browser boundary: byte-oriented terminal and WebGPU renderer through wasm-bindgen"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
glyphium-terminal-core = { path = "../terminal-core" }
glyphium-terminal-render = { path = "../terminal-render" }
wgpu = "30"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Must match the wasm-bindgen CLI version.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
