[workspace]
resolver = "3"
members = ["bench/fixtures", "bench/bakeoff", "crates/*", "apps/*"]

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Lucas Van De Weerd"]

# wgpu and winit debug info is large and the disk on the reference Mac is tight.
[profile.dev]
debug = "line-tables-only"

[profile.release]
debug = 0

# Size builds for the wasm gate: the same settings for every core.
[profile.wasm-size]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
debug = 0
panic = "abort"

# Vendored with a small wasm32 patch; see third_party/README.md.
[patch.crates-io]
alacritty_terminal = { path = "third_party/alacritty_terminal" }
vte = { path = "third_party/vte" }

[patch."https://github.com/wezterm/wezterm.git"]
termwiz = { path = "third_party/termwiz" }
wezterm-escape-parser = { path = "third_party/wezterm-escape-parser" }
wezterm-term = { path = "third_party/wezterm-term" }
